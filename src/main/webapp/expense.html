<!DOCTYPE html>
<html>
<head>
    <title>Add Expense</title>
</head>
<body>

    <h1>Add Expense</h1>

    <form action="addExpense" method="post">

        <label>Expense Type:</label>
        <input type="text" name="type" required>

        <br><br>

        <label>Amount:</label>
        <input type="number" name="amount" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
