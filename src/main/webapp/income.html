<!DOCTYPE html>
<html>
<head>
    <title>Add Income</title>
</head>
<body>

    <h1>Add Income</h1>

    <form action="addIncome" method="post">

        <label>Income Source:</label>
        <input type="text" name="source" required>

        <br><br>

        <label>Amount:</label>
        <input type="number" name="amount" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
